[workspace]
resolver = "3"
members = ["breeze-pack", "breeze-app", "breeze-tui"]

[workspace.dependencies]
anyhow = "1.0.102"
console = "0.16.3"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
strum = "0.28.0"
strum_macros = "0.28.0"

[package]
name = "breeze"
version = "1.4.0"
edition = "2021"

[dependencies]
breeze_tui = { path = "./breeze-tui" }
tokio = { version = "1.52.3", default-features = false, features = [
    "rt-multi-thread",
    "macros",
] }
